{% extends "admin/base_admin.html" %}{% block title %}Manage Courses | Abhyuday{% endblock %}
{% block admin_content %}<h1>Course Management</h1><div class="admin-panel"><h2>Add Course</h2><form method="post" class="form-grid"><label class="full">Course Name *<input name="name" required></label><label class="full">Description<textarea name="description" rows="3"></textarea></label><div class="full"><button class="btn btn-primary">Add Course</button></div></form></div><div class="admin-panel"><h2>Courses</h2>{% for c in courses %}<div class="manage-row"><div><b>{{ c.name }}</b><small>{{ c.description }}</small></div><span class="status {{ 'active' if c.active else 'inactive' }}">{{ 'Active' if c.active else 'Hidden' }}</span><form method="post" action="{{ url_for('toggle_course',course_id=c.id) }}"><button class="btn btn-outline btn-small">{{ 'Hide' if c.active else 'Show' }}</button></form></div>{% endfor %}</div>{% endblock %}
